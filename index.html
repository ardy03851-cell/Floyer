<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Foyer</title>
  <link rel="icon" type="image/png" href="assets/icons/icon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>


  <div class="topbar shimmer-surface" id="topbar">
    <div class="brand">
      <img src="assets/icons/icon.png" alt="Foyer">
      <span class="name">Foyer<span class="dot">.</span></span>
    </div>
    <div class="topbar-actions" id="authArea">
      <!-- filled by JS -->
    </div>
  </div>

  <div class="wrap">

    <div class="composer" id="composerCard" style="display:none;">
      <input type="text" id="postTitle" placeholder="Give it a title&hellip;" maxlength="140">
      <textarea id="postBody" placeholder="What's on your floor today?" maxlength="3000"></textarea>
      <input type="file" id="postMediaInput" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" style="display:none;">
      <div id="postMediaPreview"></div>
      <div class="composer-foot">
        <button class="btn btn-ghost" id="attachMediaBtn" type="button" style="padding:9px 12px;display:flex;align-items:center;gap:6px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>Attach</button>
        <span class="composer-hint" id="composerHint"></span>
        <button class="btn btn-ghost" id="cancelPostBtn" type="button">Clear</button>
        <button class="btn btn-primary" id="submitPostBtn" type="button">Post</button>
      </div>
    </div>

    <div class="feed-header">
      <h2 id="feedLabel">The floor</h2>
      <div class="sort-tabs">
        <button class="active" data-sort="new">New</button>
        <button data-sort="top">Top</button>
      </div>
    </div>

    <div id="feed">
      <div class="loading-wrap">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <!-- Ambient 3D scene (experimental settings feature) -->
  <div id="ambientScene3d"></div>

  
  <script type="module" src="js/app.js"></script>
</body>
</html>
